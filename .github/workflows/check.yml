name: winget-pkgs check
on:
  repository_dispatch:
    types: [upstream_push]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout upstream repository
        uses: actions/checkout@v7.0.1
        with:
          repository: KarbitsCode/winget-pkgs
          ref: ${{ github.event.client_payload.branch }}
          path: upstream
          fetch-depth: 0

      - name: Check manifests
        id: detect
        shell: pwsh
        continue-on-error: true
        working-directory: ./upstream
        run: |
          Install-PSResource -Name powershell-yaml -Scope CurrentUser -TrustRepository -Verbose
          Install-PSResource -Name Microsoft.WinGet.Client -Scope CurrentUser -TrustRepository -Verbose
          
          Write-Host "`n===== CheckDependencies (Online) =====`n"
          .\Tools\CheckDependencies.ps1 -Verbose
          
          Write-Host "`n===== CheckDependencies (Offline) =====`n"
          .\Tools\CheckDependencies.ps1 -Offline -Verbose
          
          Write-Host "`n===== CheckDisplayVersions =====`n"
          .\Tools\CheckDisplayVersions.ps1 -Verbose
          
          Write-Host "`n===== CheckMonikers =====`n"
          .\Tools\CheckMonikers.ps1 -Verbose

      - name: Delegate workflow
        uses: benc-uk/workflow-dispatch@v1.3.2
        if: always() && github.event_name != 'workflow_dispatch'
        with:
          workflow: auto.yml
